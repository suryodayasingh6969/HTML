<html lang="en">
<head>
    <title>list</title>
</head>
<body>
    
    <h1>Unordered list</h1>
    <ul>
        <li>Hyderabad</li>
        <li>Jaipur</li>
        <li>Delhi</li>
    </ul>

    <h1>Ordered List</h1>
    <ol>
        <li>India</li>
        <li>Pakistan</li>
        <li>Srilanka</li>
    </ol>
    <h1>Description list</h1>
    <dl>
        <dt>Coffee</dt>
        <dd>-Hot Beverage</dd>
    </dl>
</body>
</html>

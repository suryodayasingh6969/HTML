<!DOCTYPE html>
<html>
<head>
    <title>Type Conversion</title>
</head>
<body>
    <h1>Type conversion</h1>
    <div id="result"></div>
    <div id="result1"></div>
    <script>
        var x = 90;
        var y = 11;
        document.getElementById("result").innerHTML ="The answer is " + (x + y);
        document.getElementById("result1").innerHTML ="The answer is" + String(x)+String(y)
    </script>

</body>
</html>

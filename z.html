<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Calculator</title>
</head>
<body>
   <h1>Area Calculator</h1> 
   <script>
    ch = prompt("1. Rectangle \n2.Triangle \n3.Parelllogram \n4.Circle \n Enter your choice")
    if (ch == "1") {
        var b = prompt("Enter the breadth of the rectangle");
        var l = prompt("Enter the length of the rectangle");
        var a = Number(b) * Number(l);
        alert("The area is " + a);
    }

    else if (ch == "2") {
        var b = prompt("Enter the base of the triangle");
        var h = prompt("Enter the height of the triangle");
        var a = (1/2) * Number(b) * Number(h);
        alert("The area is " + a);
    } 

        else if (ch == "3") {
        var b = prompt("Enter the base of the Parelllogram");
        var h = prompt("Enter the height of the Parelllogram");
        var a = (1/2) * Number(b) * Number(h);
        alert("The area is " + a);
    } 
        else if (ch == "4") {
        var r = prompt("Enter the Radius of the circle");

        var a = Number(r) * Number(r) * 3.14159
        alert("The area is"+a)
    }  

   </script>
</body>
</html>

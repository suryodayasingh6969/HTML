<body>

<script>
class Car {
    constructor(brand) {
        this.brand = brand;
    }
    disp() {
        return this.brand;
    }
}
class Model extends Car {
    constructor(brand, mod) {
        super(brand);
        this.mod = mod;
    }
    disp1() {
        let a = this.disp();
        return a + " " + this.mod;
    }
}
    var model1  =new model("Toyota","Camry")
    documment.getElementById("result").innerHTML= "The car brand and model is" +model1.disp1()
</script>

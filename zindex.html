<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstone Projext</title>
    <style>
        body{
            background-color:rgba(216, 216, 216, 0.247);
            margin: 0px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;   
        }
        .topnav{
            background-color: rgb(255, 230, 0);
            overflow:hidden;   
        }
        .topnav a{
            float: right;
            color: aquamarine;
            font-size: 17px;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .topnav a:hover{
            color: chocolate;
            font-size: 21;
        }
        .topnav a.active{
            background-color: rgba(255, 251, 0, 0.123);
            color: black;
        }
        .carousel-container{
            width: 250px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .myslides{
            display: none;
            max-width: 100%;
            max-height: 100%;   
        }
    </style>     
</head>
<body>
    <div class ="topnav">
        <a href = "index.html" class="active">Home</a>
        <a href = "about.html" >About</a>
        <a href = "contact.html" >contact</a>
        <a href = "gallery.html" >Gallery</a>
    </div>
    <div class ="carousel-container">
        <img class ="myslides" src = "download (1).jpeg">
        <img class ="myslides" src = "download (6).jpeg">
        <img class ="myslides" src = "download.jpeg">
    </div>
    <script>
        var index = 0;
        function carousel(){
            var i;
            var x = document.getElementsByClassName("myslides")
            for(i=0;i<x.length; i++){
                x[i].style.display ="none"
            }
            index++;
            if (index >x.length){
                index=1
            }
            x[index-1].style.display ="block";
            setTimeout(carousel,2000)
        }
        carousel()
    </script>
</body>
</html>
